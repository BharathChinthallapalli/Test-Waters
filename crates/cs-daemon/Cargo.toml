[package]
name = "cs-daemon"
description = "Callsheet daemon binary and control API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
cs-core = { version = "0.1.0", path = "../cs-core" }
cs-store = { version = "0.1.0", path = "../cs-store" }
etcetera = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
# Pinned to the versions axum 0.8.9 already resolves to; used directly to set the
# header-read timeout (see src/serve.rs).
hyper = { version = "1.11.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
serde = "1.0.229"
serde_json = "1.0.151"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", default-features = false, features = ["timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }

# Already in the tree through tempfile and async-io; `geteuid` is a safe call.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["process"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util"] }
tower = { version = "0.5.3", features = ["util"] }
