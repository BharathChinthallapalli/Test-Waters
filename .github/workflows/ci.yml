# Quality gates for every push to main and every pull request
# (feature 01, task 5; requirement 4). The `CI passed` job is the only one the
# main-branch ruleset needs to require: it fails unless every gate succeeded.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# No token permissions by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Behaviour that differs by platform (feature 02, R7.2): every cs-store and
  # cs-daemon test, including owner-only files (protected DACL), the instance
  # lock and discovery, and the daemon binary. See docs/ci.md for what can't run
  # here (sending a console control event needs Win32 FFI).
  windows:
    name: Rust on Windows (cs-store, cs-daemon)
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p cs-store -p cs-daemon --locked

  cargo-deny:
    name: Rust dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Prebuilt release binary, checked against a pinned SHA-256 (the value
      # published next to the release asset), instead of building from source.
      - name: Install cargo-deny
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          archive="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL -o deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${archive}.tar.gz"
          echo "${DENY_SHA256}  deny.tar.gz" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf deny.tar.gz --strip-components=1 -C "$HOME/.local/bin" "${archive}/cargo-deny"
          rm deny.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo deny check

  ts:
    name: TypeScript (Biome, typecheck, test, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm audit

  types:
    name: Generated types are current
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/gen-types.ts --check

  # The TypeScript client test against the real daemon binary (feature 02,
  # R2.8, R2.9). It has its own script so `pnpm -r test` never skips it for a
  # missing binary; here the binary is always built first.
  daemon-client:
    name: TypeScript client against the daemon
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p cs-daemon --locked
      - run: pnpm -C packages/api-types test:integration

  # Nothing leaves the machine by default (PRIVACY.md, issue #56): the built
  # desktop app (fresh profile, then a restart against the real daemon) and
  # cs-daemon start behind logging proxies that refuse every request, and
  # under strace, which records every socket they connect or send to. Any
  # request, or any socket call beyond this machine, fails the job; a canary
  # first proves both backstops see traffic. See docs/ci.md for what this does
  # and doesn't cover.
  egress:
    name: Desktop makes no outbound requests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Xvfb is on the ubuntu-24.04 image already; strace isn't.
      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace
      - run: pnpm install --frozen-lockfile
      # Electron 44 has no install script: its binary is downloaded on first
      # use. Download it here, checked against the checksums in the electron
      # package, so a failed download fails this step and not the check.
      - name: Download the Electron binary
        run: pnpm -C apps/desktop exec install-electron
      # Ubuntu 23.10 and later restrict unprivileged user namespaces with
      # AppArmor, so Chromium uses its setuid sandbox helper, which must be
      # owned by root with mode 4755 (Chromium's
      # docs/security/apparmor-userns-restrictions.md and
      # docs/linux/suid_sandbox_development.md). The app keeps its sandbox;
      # --no-sandbox is never used here.
      - name: Set up Chromium's setuid sandbox helper
        working-directory: apps/desktop
        run: |
          helper="$(node -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - run: pnpm -C apps/desktop build
      - run: cargo build -p cs-daemon --locked
      # Under an unprivileged tracer the setuid helper runs without root and
      # Chromium aborts, so strace runs as root through sudo and starts each
      # traced process as this user (`strace -u`); nothing under test runs as
      # root. The check also writes its tally to the job summary.
      - name: Start the app and the daemon behind logging proxies, under strace
        working-directory: apps/desktop
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            node scripts/egress-check.ts --trace-as-user "$(id -un)"

  ci-passed:
    name: CI passed
    if: always()
    needs: [rust, windows, cargo-deny, ts, types, daemon-client, egress]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every gate succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
