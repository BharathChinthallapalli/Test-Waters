# cargo-deny configuration (feature 01, task 5.2).
# Docs: https://github.com/EmbarkStudios/cargo-deny/tree/0.20.2/docs/src/checks

[advisories]
# Known vulnerabilities always fail. Also fail on yanked crates, and on
# unmaintained crates that the workspace depends on directly.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Licences allowed for dependencies. The project's own licence is still an
# owner decision (ADR 0008, issue #4); keep this list compatible with it.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
# Workspace crates are `publish = false` and carry no licence field yet.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
